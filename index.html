<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5c0f0f" id="themeMeta">
<title>Store Operation Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Cambria is used first. Caladea (metric-compatible with Cambria) is the web fallback for phones/Macs without Cambria.
     Cambria has no Tamil glyphs, so Tamil text falls back to Nirmala UI / Noto Sans Tamil. -->
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#5c0f0f;--tint:#f6ecec;--bg:#faf6ee;--line:#e9e2d0;--gold:#c8911a;--green:#1e8a3c;--red:#c0392b;--amber:#d97706;--mut:#6b7280;--ink:#1f2433;
--font:Cambria,Caladea,'Nirmala UI','Noto Sans Tamil',Latha,Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-top:5px solid var(--navy);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--navy);font-size:16px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button,.chip-btn{border:1px solid transparent;background:#f1ece0;color:#4b5563;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.nav button.on,.chip-btn.on{background:#fff;border-color:var(--navy);color:var(--navy)}
.sp{flex:1}
.top select,.sel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 10px;font-weight:700;font-size:12px;color:#4b5563}
.lang button.on{background:var(--navy);color:#fff}
.who{font-size:12px;color:var(--mut)}
.ghost{background:none;border:0;color:var(--navy);font-weight:700;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.ok{background:var(--green)}.dot.syncing{background:var(--amber)}.dot.err{background:var(--red)}
main{max-width:780px;margin:0 auto;padding:14px 14px 90px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.filters input[type=date]{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:13px;display:inline-block}
.btn.gold{background:var(--gold)}
.btn.out{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero{border-radius:12px;padding:16px 18px;display:flex;gap:14px;align-items:center;border:1px solid}
.hero .orb{width:44px;height:44px;border-radius:50%;border:3px solid #111;flex:none}
.hero h2{margin:0;font-size:21px;font-weight:700}
.hero p{margin:2px 0 0;font-size:13px;color:#555}
.hero.bad{background:#fdeaea;border-color:#f1b9b9}.hero.bad h2{color:#c0392b}.hero.bad .orb{background:#e8142a}
.hero.warn{background:#fff4e0;border-color:#f3d39a}.hero.warn h2{color:#b45309}.hero.warn .orb{background:#f59e0b}
.hero.ok{background:#e8f6ec;border-color:#b6e2c2}.hero.ok h2{color:var(--green)}.hero.ok .orb{background:#22c55e}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center;padding:12px 4px}
.kpi b{display:block;font-size:29px;line-height:1.1}
.kpi span{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.h{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:18px;font-weight:700;color:var(--navy)}
.h .cnt{font-size:12px;background:#fde8e8;color:var(--red);border-radius:999px;padding:1px 9px}
.h:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.pad{padding:14px}
.srow{display:grid;grid-template-columns:28px 1fr 64px;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.sname{font-weight:700;font-size:14px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.sname small{font-weight:400;color:var(--mut)}
.bar{height:10px;border-radius:6px;background:#ece6d6;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .y{background:var(--green)}.bar .n{background:var(--red)}
.score{text-align:right;font-weight:700;font-size:16px;color:var(--navy)}
.score small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.fail{padding:12px 14px;border-bottom:1px solid var(--line)}
.fail:last-child{border-bottom:0}
.fh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{background:var(--tint);color:var(--navy);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.meta{font-size:11px;color:var(--mut)}
.fr{margin-top:6px;background:#fdf3f3;border-left:3px solid var(--red);padding:6px 9px;border-radius:4px;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.prog{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.pbar{height:8px;background:#ece6d6;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.tabs button{border:0;background:#fff;padding:12px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.tabs .c{font-size:11px;background:var(--tint);color:var(--navy);padding:1px 8px;border-radius:999px;margin-left:6px}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sech{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.sech .t{font-weight:700;color:var(--navy);font-size:16px;flex:1}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fdf0c9;color:#8a5a00;white-space:nowrap}
.pill.g{background:#e3f4e8;color:var(--green)}
.secb{padding:0 12px 12px}
.task{background:#fcfaf4;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:9px}
.tq{font-size:15px;margin-bottom:9px}
.badge{display:inline-block;font-size:10px;font-weight:700;background:var(--tint);color:var(--navy);border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;font-weight:700;font-size:15px;color:#555}
.yn button.on.yes{background:var(--green);border-color:var(--green);color:#fff}
.yn button.on.no{background:var(--red);border-color:var(--red);color:#fff}
.yn button[disabled]{opacity:.7;cursor:default}
.rem{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;resize:vertical;min-height:40px;background:#fff}
.rem.req{border-color:var(--red);background:#fff8f8}
.addrem{background:none;border:0;color:var(--navy);font-size:12px;font-weight:700;margin-top:6px;padding:0}
.tmeta{font-size:11px;color:var(--mut);margin-top:6px}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:#f7f2e4;border-top:1px solid var(--line)}
.sub span{font-size:12px;color:var(--mut)}
.banner{background:#e8f6ec;border:1px solid #b6e2c2;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;color:var(--green)}
.login{max-width:390px;margin:7vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.login .lg{width:84px;height:84px;border-radius:16px;object-fit:cover;margin:6px auto 8px;display:block}
.login h1{color:var(--navy);font-size:23px;margin:4px 0 2px}
.login p{color:var(--mut);margin:0 0 12px;font-size:14px}
.login .f{text-align:left}
.login label,.fld label{display:block;font-size:12px;font-weight:700;margin:11px 0 4px}
.login input,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;background:#fff}
.login .btn{width:100%;margin-top:16px;padding:12px;font-size:16px}
.login .lg2{height:38px;margin-top:16px;opacity:.9}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.hint{font-size:12px;color:var(--mut);margin-top:12px}
.hint.okc{color:var(--green)}.hint.bad{color:var(--red)}
.fld small{color:var(--mut);font-size:11px;display:block;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.logoBox{display:flex;gap:14px;align-items:center;border:1px dashed #cfc6ad;border-radius:12px;padding:12px;margin-top:6px}
.logoBox img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.logoBox .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.srow2{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;margin-top:8px}
.srow2 input{padding:8px 10px}
.srow2 button{border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--red);font-weight:700}
.sw{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2433;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* ---------- view modes (Mobile / Desktop) ---------- */
.vsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vsw button{border:0;background:#fff;padding:5px 9px;font-size:15px;line-height:1}
.vsw button.on{background:var(--navy);color:#fff}
.dgrid{display:block}
html[data-mode=mobile] #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
html[data-mode=mobile] body{background:#ece6d6}
html[data-mode=mobile] .top{padding:8px 12px;gap:8px}
html[data-mode=mobile] .brand span{max-width:140px}
html[data-mode=mobile] .who{display:none}
html[data-mode=mobile] main{padding:12px 12px 100px}
html[data-mode=mobile] .kpis{grid-template-columns:repeat(2,1fr)}
html[data-mode=mobile] .grid2{grid-template-columns:1fr}
html[data-mode=mobile] .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;margin:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
html[data-mode=mobile] .nav button{border-radius:10px;padding:11px 4px;font-size:13px;background:transparent}
html[data-mode=mobile] .nav button.on{background:var(--tint);border-color:transparent}
html[data-mode=mobile] .login{margin:5vh 14px}
html[data-mode=desktop] .top{padding:10px 28px}
html[data-mode=desktop] main{max-width:1200px;padding:20px 28px 60px}
html[data-mode=desktop] .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
html[data-mode=desktop] .secgrid{column-count:2;column-gap:16px}
html[data-mode=desktop] .secgrid .sec,html[data-mode=desktop] .secgrid .card{break-inside:avoid}
html[data-mode=desktop] .setgrid{column-count:2;column-gap:18px}
html[data-mode=desktop] .setgrid .card{break-inside:avoid;margin:0 0 14px!important}
html[data-mode=desktop] .kpi b{font-size:34px}
html[data-mode=desktop] .login{max-width:430px}
@media(max-width:560px){html:not([data-mode]) .kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- preview screen ---------- */
#pv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#44403a;display:flex;flex-direction:column}
.pv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line)}
.pv-bar b{color:var(--navy);font-size:14px;flex:1;min-width:150px}
.pv-body{flex:1;overflow:auto;padding:14px 8px 30px;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}
.pv-wrap{position:relative;flex:none;background:#fff;box-shadow:0 3px 20px rgba(0,0,0,.45)}
.pv-inner{width:794px;transform-origin:top left}
body.pvopen{overflow:hidden}

/* ---------- Store Operation Checklist Summary (preview + PDF) ---------- */
#printArea{position:fixed;left:-10000px;top:0;width:794px}
.rp{width:794px;background:#fff;color:#1f2433;font-family:var(--font);font-size:12px;line-height:1.4}
.rp table{border-collapse:collapse;width:100%}
.rp-head{background:var(--navy);color:#fff}
.rp-head td{vertical-align:middle}
.rp-head .hl{width:116px;text-align:center;padding:12px 0 12px 18px}
.rp-head .hl span{display:block;box-sizing:border-box;width:98px;background:#fff;border-radius:8px;padding:6px 9px}
.rp-head .hl img{display:block;height:58px;width:auto;max-width:78px;margin:0 auto}
.rp-head .hm{text-align:center;padding:12px 10px}
.rp-head h1{margin:0;font-size:23px;line-height:1.2}
.rp-head .ti{font-size:14px;font-weight:700;margin-top:5px}
.rp-head .fcode{font-size:10.5px;opacity:.9;margin-top:3px}
.rp-head .hr{width:116px;text-align:center;padding:12px 18px 12px 0}
.rp-head .hr img{display:block;width:66px;height:66px;border-radius:8px;margin:0 auto;object-fit:cover}
.rp-meta td{width:25%;padding:10px 18px;border-bottom:1px solid #e9e2d0;border-right:1px solid #e9e2d0;vertical-align:top}
.rp-meta td:last-child{border-right:0}
.rp-meta small{display:block;color:#6b7280;font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.rp-meta b{font-size:12.5px}
.rp-pad{padding:0 24px}
.rp-ov{margin-top:16px}
.rp-ov td{vertical-align:middle}
.rp-ov .big{width:200px;text-align:center;padding:4px 10px;border-right:1px solid #e9e2d0}
.rp-ov .pct{font-size:46px;font-weight:700;color:var(--navy);line-height:1}
.rp-ov .sc{font-size:14px;color:#444;margin-top:5px}
.rp-ov .lb{font-size:9.5px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.rp-ov .rt{padding:4px 0 4px 22px}
.rp-tiles{margin-top:14px;border-collapse:separate!important;border-spacing:8px 0}
.rp-tiles td{width:33.33%;text-align:center;border:1px solid #e9e2d0;border-radius:6px;padding:8px 4px}
.rp-tiles b{display:block;font-size:21px;line-height:1.2}
.rp-tiles small{font-size:9px;color:#6b7280;letter-spacing:.06em}
.rp h3{margin:20px 0 8px;color:var(--navy);font-size:15px;border-bottom:2px solid #c8911a;padding-bottom:5px}
.rp-bar{display:flex;border-radius:7px;background:#ece6d6;overflow:hidden}
.rp-bar i{display:block;height:100%}
.rp-sc td{padding:8px 6px;border-bottom:1px solid #f0ebdc;vertical-align:middle}
.rp-sc .c1{width:30px}
.rp-sc .c2{width:230px}
.rp-sc .c4{width:56px;text-align:right}
.rp-sc .c5{width:116px;font-size:10px;line-height:1.3;padding-left:12px}
.rp-sc .n{display:inline-block;width:22px;background:var(--navy);color:#fff;border-radius:4px;text-align:center;font-weight:700;font-size:10.5px;padding:3px 0}
.rp .ok{color:#1e8a3c;font-weight:700}.rp .no{color:#c0392b;font-weight:700}.rp .pe{color:#9ca3af}
.rp small{color:#6b7280}
.rp-fail{border:1px solid #f1b9b9;border-left:4px solid #c0392b;border-radius:4px;padding:8px 11px;background:#fffafa;margin-bottom:8px}
.rp-fail .fh{font-size:11px;color:var(--navy)}
.rp-fail .mt{color:#6b7280;font-size:10px;margin-left:6px}
.rp-fail .ft{margin:4px 0 3px}
.rp-fail .fr2{font-size:11.5px}
.rp-okmsg{color:#1e8a3c;font-weight:700;padding:4px 0}
.rp-log th{background:var(--navy);color:#fff;text-align:left;padding:6px 7px;font-size:10px}
.rp-log td{border-bottom:1px solid #eee7d6;padding:6px 7px;vertical-align:top}
.rp-log .sh td{background:#f1ecdd;font-weight:700;color:var(--navy)}
.rp-sign td{width:50%;padding:38px 14px 0}
.rp-sign div{border-top:1px solid #555;padding-top:4px;font-size:10px;color:#555}
.rp-foot{margin-top:16px;padding-top:7px;border-top:1px solid #e9e2d0;font-size:9px;color:#6b7280;padding-bottom:6px}
@media print{@page{size:A4;margin:8mm}body.printing>*:not(#printArea){display:none!important}body.printing #printArea{position:static;width:auto}body.printing .rp{width:auto}body.printing .pb{page-break-before:always}body.printing tr,body.printing .rp-fail{page-break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   DEPLOYMENT SETTING  -  paste your Cloudflare Worker URL between the quotes,
   then upload this file to GitHub. Empty = DEMO MODE (data stays in this browser only).

const DATA = {"sections": [{"c": 1, "en": "Opening Procedures", "ta": "திறப்பு நடைமுறைகள்"}, {"c": 2, "en": "Stock & Inventory Control", "ta": "இருப்பு மற்றும் சரக்குக் கட்டுப்பாடுகள்"}, {"c": 3, "en": "Security & Loss Prevention", "ta": "பாதுகாப்பு மற்றும் இழப்பு தடுப்பு"}, {"c": 4, "en": "Sales & Billing", "ta": "விற்பனை மற்றும் பில்லிங்"}, {"c": 5, "en": "Customer Service & Experience", "ta": "வாடிக்கையாளர் சேவை மற்றும் அனுபவம்"}, {"c": 6, "en": "Visual Merchandising", "ta": "காட்சி வணிகம்"}, {"c": 7, "en": "Cash & Finance Management", "ta": "ரொக்கம் மற்றும் நிதி மேலாண்மை"}, {"c": 8, "en": "Staff Management", "ta": "பணியாளர் மேலாண்மை"}, {"c": 9, "en": "Closing Procedures", "ta": "முடிவு நடைமுறைகள்"}], "tasks": [{"id": 1, "s": 1, "en": "Key holders to confirm that the store is opened.", "ta": "சாவியை வைத்திருப்பவர்கள், கடை திறக்கப்பட்டிருப்பதை உறுதிசெய்து கொள்ளவும்."}, {"id": 2, "s": 1, "en": "Verify staff attendance, punctuality, appearance and uniform.", "ta": "பணியாளர்களின் வருகை, நேரந்தவறாமை, தோற்றம் மற்றும் சீருடை ஆகியவை சரிபார்க்கப்படுவதை உறுதிசெய்யவும்."}, {"id": 3, "s": 1, "en": "Confirm the alarm is deactivated, and that night alarm logs and signs of forced entry have been checked.", "ta": "அலாரம் செயலிழக்கச் செய்யப்பட்டுள்ளதா என்பதையும், இரவு நேர அலாரம் பதிவுகள் மற்றும் வலுக்கட்டாயமாக நுழைந்ததற்கான அறிகுறிகள் சரிபார்க்கப்பட்டுள்ளனவா என்பதையும் உறுதிப்படுத்தவும்."}, {"id": 4, "s": 1, "en": "Ensure the safe is opened under dual custody (two authorised persons).", "ta": "பாதுகாப்புப் பெட்டகம் இரட்டைப் பொறுப்பின் கீழ் (அங்கீகரிக்கப்பட்ட இரண்டு நபர்கள்) திறக்கப்படுவதை உறுதிசெய்யவும்."}, {"id": 5, "s": 1, "en": "Ensure lights, display lights, AC, payment systems and CCTV are working (confirm all cameras are recording).", "ta": "விளக்குகள், காட்சி விளக்குகள், ஏசி, கட்டண அமைப்புகள் மற்றும் சிசிடிவி ஆகியவை இயக்கத்தில் இருப்பதை உறுதிசெய்யவும் (அனைத்து கேமராக்களும் பதிவு செய்கின்றனவா என்பதை உறுதிப்படுத்தவும்)."}, {"id": 6, "s": 1, "en": "Check that the opening stock count matches the previous day's closing stock.", "ta": "தொடக்க இருப்பு (opening stock) எண்ணிக்கை, முந்தைய நாளின் இறுதி எண்ணிக்கையுடன் (closing stock) பொருந்துகிறதா என்பதைச் சரிபார்க்கவும்."}, {"id": 7, "s": 1, "en": "Ensure the gold/silver rate board is updated/verified for today's rate (rates used must also be recorded).", "ta": "தங்கம்/வெள்ளி விலைப் பலகை இன்றைய விலைக்குப் புதுப்பிக்கப்பட்டு/சரிபார்க்கப்பட்டுள்ளதை உறுதிசெய்யுங்கள் (மேலும் பயன்படுத்தப்பட்ட விலைகள் பதிவு செய்யப்பட வேண்டும்)."}, {"id": 8, "s": 2, "en": "Ensure display jewellery from the safe is placed in the showcases as per the tray/table plan.", "ta": "பாதுகாப்புப் பெட்டகத்தில் உள்ள காட்சி நகைகள், தட்டு/மேசைத் திட்டத்தின்படி காட்சிப் பெட்டிகளில் வைக்கப்படுவதை உறுதிசெய்யவும்."}, {"id": 9, "s": 2, "en": "Ensure items given for repair, polishing or resizing, items handed to craftsmen, items taken by customers, and approval/memo items received from vendors are recorded.", "ta": "பழுதுபார்ப்பதற்கோ, மெருகூட்டுவதற்கோ, அளவை மாற்றுவதற்கோ அல்லது கைவினைஞரிடம் ஒப்படைக்கப்படும் பொருட்களோ, வாடிக்கையாளர்களால் எடுக்கப்பட்ட அல்லது விற்பனையாளர்களிடமிருந்து பெறப்பட்ட ஒப்புதல்/குறிப்புப் பொருட்களோ பதிவு செய்யப்படுவதை உறுதிசெய்யவும்."}, {"id": 10, "s": 2, "en": "Ensure incoming stock weight, purity and HUID are verified against the invoice.", "ta": "வரும் சரக்குகளின் எடை, தூய்மை மற்றும் HUID ஆகியவை விலைப்பட்டியலுடன் (INVOICE) சரிபார்க்கப்படுவதை உறுதிசெய்யவும்."}, {"id": 11, "s": 3, "en": "Ensure the 'one tray per customer' rule is enforced at the counters.", "ta": "கவுன்டர்களில் 'ஒரு வாடிக்கையாளருக்கு ஒரு தட்டு' என்ற விதி அமல்படுத்தப்படுவதை உறுதிசெய்யவும்."}, {"id": 12, "s": 4, "en": "Confirm billing software, weighing scales, card/UPI machines and purity testing equipment (touchstone/XRF) are working.", "ta": "பில்லிங் மென்பொருள், எடை அளவுகள், கார்டு/UPI இயந்திரங்கள் மற்றும் தூய்மை சோதனை உபகரணங்கள் (டச்ஸ்டோன்/XRF) ஆகியவை செயல்படுகின்றனவா என்பதை உறுதிப்படுத்தவும்."}, {"id": 13, "s": 4, "en": "Ensure old gold transaction records are verified: purity test, deduction, customer ID number and KYC.", "ta": "பழைய தங்கப் பரிவர்த்தனைப் பதிவுகள் சரிபார்க்கப்பட்டுள்ளதை உறுதிசெய்யவும்: தூய்மைச் சோதனை, பிடித்தம், வாடிக்கையாளர் அடையாள எண் மற்றும் வாடிக்கையாளரை அறிதல் (KYC) உறுதிசெய்யவும்."}, {"id": 14, "s": 4, "en": "Confirm advance bookings, custom orders and scheme instalments.", "ta": "முன்கூட்டிய முன்பதிவுகள், தனிப்பயன் ஆர்டர்கள் மற்றும் திட்டக் கட்டணங்களை உறுதிப்படுத்தவும்."}, {"id": 15, "s": 4, "en": "Ensure KYC/PAN is collected for high-value transactions and the records are filed.", "ta": "அதிக மதிப்புள்ள பரிவர்த்தனைகளுக்கு KYC/PAN சேகரிக்கப்பட்டு, அதற்கான பதிவுகள் தாக்கல் செய்யப்படுவதை உறுதிசெய்யவும்."}, {"id": 16, "s": 5, "en": "Ensure mirrors, showcases, trays and sample tables are cleaned; keep sample mirrors, cloths and sanitizer ready.", "ta": "கண்ணாடிகள், காட்சிப் பெட்டிகள், தட்டுகள் மற்றும் மாதிரி மேசைகள் சுத்தம் செய்யப்பட்டுள்ளதை உறுதி செய்யவும்; மாதிரி கண்ணாடிகள், துணிகள் மற்றும் கிருமிநாசினி தயாராக வைத்திருக்கவும்."}, {"id": 17, "s": 5, "en": "Ensure complaints, returns and exchanges are handled and recorded in the CRM app.", "ta": "புகார்கள், திருப்பியளித்தல் மற்றும் மாற்றுதல் ஆகியவை CRM செயலியில் கையாளப்பட்டுப் பதிவு செய்யப்படுவதை உறுதிசெய்யவும்."}, {"id": 18, "s": 5, "en": "Ensure sales and enquiries logged in the CRM are followed up.", "ta": "CRM-இல் செய்யப்படும் விற்பனைகள் மற்றும் விசாரணைகள் பின்தொடரப்படுவதை உறுதிசெய்யுங்கள்."}, {"id": 19, "s": 6, "en": "Confirm price and offer display boards are correct.", "ta": "விலை மற்றும் சலுகை அறிவிப்புப் பலகைகள் சரியாக உள்ளதா என உறுதிப்படுத்தவும்."}, {"id": 20, "s": 7, "en": "Ensure cash is counted at opening and closing and reconciled with POS totals and UPI/bank/card checks.", "ta": "கடை திறக்கும்போதும் மூடும்போதும் பணம் எண்ணப்படுவதையும், அதனை POS மொத்தத் தொகைகள் மற்றும் UPI/வங்கி/அட்டை சரிபார்ப்புகளுடன் ஒப்பிட்டுச் சரிக்கட்டுவதையும் உறுதிசெய்யவும்."}, {"id": 21, "s": 7, "en": "Ensure petty cash expenses are recorded.", "ta": "சில்லறைப் பணச் செலவுகள் பதிவு செய்யப்படுவதை உறுதிசெய்யவும்."}, {"id": 22, "s": 7, "en": "Confirm that cash has been deposited in the bank or held, as per policy.", "ta": "கொள்கையின்படி பணம் வங்கியில் செலுத்தப்பட்டுள்ளதா அல்லது முடக்கப்பட்டுள்ளதா என்பதை உறுதிப்படுத்தவும்."}, {"id": 23, "s": 7, "en": "Ensure the day's sales, transactions and advances have been verified.", "ta": "அன்றைய விற்பனைகள், பரிவர்த்தனைகள் மற்றும் முன்பணங்கள் சரிபார்க்கப்பட்டிருப்பதை உறுதிசெய்யவும்."}, {"id": 24, "s": 8, "en": "Ensure a short morning meeting is held (targets, offers, schemes, new arrivals, reminders).", "ta": "ஒரு சுருக்கமான காலைக் கூட்டம் நடத்தப்படுவதை உறுதிசெய்யுங்கள் (இலக்குகள், சலுகைகள், திட்டங்கள், புதிய வரவுகள், நினைவூட்டல்கள்)."}, {"id": 25, "s": 8, "en": "Ensure staff-related issues or incidents are recorded.", "ta": "பணியாளர் தொடர்பான பிரச்சனைகள் அல்லது சம்பவங்கள் பதிவு செய்யப்படுவதை உறுதிசெய்யவும்."}, {"id": 26, "s": 9, "en": "Ensure closing stock (weight and count) is verified against the day's sales, returns and movements; discrepancies must be resolved, or recorded and reported to seniors.", "ta": "இறுதி இருப்பு (எடை மற்றும் எண்ணிக்கை) அன்றைய விற்பனை, திருப்பங்கள் மற்றும் நகர்வுகளுடன் சரிபார்க்கப்படுவதை உறுதிசெய்யவும்; முரண்பாடுகள் தீர்க்கப்பட வேண்டும், அல்லது பதிவு செய்யப்பட்டு உயர் அதிகாரிகளுக்குத் தெரிவிக்கப்பட வேண்டும்."}, {"id": 27, "s": 9, "en": "Confirm all jewellery, repair items and valuables are returned to the safe.", "ta": "அனைத்து நகைகள், பழுதுபார்க்கும் பொருட்கள் மற்றும் மதிப்புமிக்க பொருட்கள் பாதுகாப்புப் பெட்டகத்தில் திருப்பி வைக்கப்பட்டுள்ளதா என்பதை உறுதிப்படுத்தவும்."}, {"id": 28, "s": 9, "en": "Ensure the safe is locked under dual custody; the time and the authorising staff must be recorded.", "ta": "பாதுகாப்புப் பெட்டகம் இரட்டைப் பாதுகாப்பின் கீழ் பூட்டப்பட்டுள்ளதை உறுதிசெய்யுங்கள்; நேரமும் அதை அங்கீகரித்த பணியாளரும் பதிவு செய்யப்பட வேண்டும்."}, {"id": 29, "s": 9, "en": "Confirm all billing entries are completed and the day-end report (sales, cash, stock) is printed/saved.", "ta": "அனைத்துப் பில்லிங் பதிவுகளும் முடிக்கப்பட்டு, அன்றைய தின இறுதி அறிக்கை (விற்பனை, ரொக்கம், இருப்பு) அச்சிடப்பட்டு/சேமிக்கப்பட்டுள்ளதா என்பதை உறுதிப்படுத்தவும்."}, {"id": 30, "s": 9, "en": "Confirm billing data has been backed up / filed.", "ta": "கட்டணத் தரவுகள் காப்புப் பிரதி எடுக்கப்பட்டுள்ளதா என்பதை உறுதிப்படுத்தவும். (BACK UP / FILING)"}, {"id": 31, "s": 9, "en": "Confirm lights, AC and electronic devices (except security systems) are switched off; also ensure CCTV and alarm are running.", "ta": "விளக்குகள், ஏசி மற்றும் மின்னணுசாதனங்கள் (பாதுகாப்பு அமைப்புகளைத் தவிர) அணைக்கப்பட்டுள்ளதா என்பதை உறுதிப்படுத்தவும்; சிசிடிவி மற்றும் அலாரம் இயங்குகின்றனவா என்பதையும் உறுதிசெய்யவும்."}, {"id": 32, "s": 9, "en": "Ensure doors and shutters are locked, and hand over the keys as per the key register.", "ta": "கதவுகளும் ஜன்னல் கதவுகளும் பூட்டப்பட்டிருப்பதை உறுதிசெய்து, சாவிப் பதிவேட்டின்படி சாவிகளை ஒப்படைக்கவும்."}]};

/* ---------------- helpers ---------------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let cfg = {...DEFAULTS, ...store.get('svv_cfg',{})};
try{ const q=new URLSearchParams(location.search).get('api'); if(q&&/^https:\/\//.test(q)){ cfg.apiUrl=q; store.set('svv_cfg',cfg); } }catch(e){}
const API_URL = () => String(BAKED_API_URL || cfg.apiUrl || '').trim().replace(/\/+$/,'');
/* demo mode (no server) is only allowed when the file is opened from a computer, or with ?demo=1. A published app without a server address must not silently keep data on one phone. */
const DEMO_OK = location.protocol==='file:' || /[?&]demo=1/.test(location.search);
let SECS = DATA.sections, TASKS = DATA.tasks.map(t=>({...t,m:t.m!==false}));
(function(){ const m=store.get('svv_master',null); if(m&&m.tasks&&m.tasks.length&&API_URL()) applyMaster(m,false); })();
function applyMaster(m,save=true){ SECS=m.sections; TASKS=m.tasks.map(t=>({...t,m:t.m!==false})); if(save) store.set('svv_master',m); }

const S = {
  lang: store.get('svv_lang',null) || cfg.defaultLang || 'en',
  user: store.get('svv_user',null),
  view: 'dash', store: store.get('svv_store',null),
  from: null, to: null, cdate: null, tab: 'pending',
  collapsed: {}, openRem: {}, keep: {},
  resp: store.get('svv_resp',{}), sub: store.get('svv_sub',{}),
  loginErr: '', setDraft: null, conn: null
};
const VIEW_KEY='svv_view';
function effMode(){ const p=store.get(VIEW_KEY,'auto'); if(p==='mobile'||p==='desktop') return p; return window.innerWidth>=900?'desktop':'mobile'; }
function applyMode(){
  const p=store.get(VIEW_KEY,'auto'); document.documentElement.dataset.mode=effMode();
  const vp=document.querySelector('meta[name=viewport]');
  if(vp) vp.content=(p==='desktop'&&screen.width<900)?'width=1100':'width=device-width,initial-scale=1';   // phone asked for the desktop layout
}
const T = k => { const a=I18N[S.lang][k]; if(a!==undefined&&a!==null) return a; const b=I18N.en[k]; return (b!==undefined&&b!==null)?b:k; };
const $ = s => document.querySelector(s);
const esc = s => String((s===undefined||s===null)?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = o => o[S.lang] || o.en;
const mainLogo = () => cfg.logoMain || DEFAULT_LOGO_MAIN;
const secLogo  = () => cfg.logoSecond || DEFAULT_LOGO_2;
function hexMix(hex,pct){ const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,m=c=>Math.round(c+(255-c)*pct).toString(16).padStart(2,'0'); return '#'+m(r)+m(g)+m(b); }
function applyTheme(){
  const c=/^#[0-9a-f]{6}$/i.test(cfg.color)?cfg.color:DEFAULTS.color;
  document.documentElement.style.setProperty('--navy',c);
  document.documentElement.style.setProperty('--tint',hexMix(c,.92));

/* dates (IST) */
const todayISO = () => new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const addDays = (iso,n) => { const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const daysBetween = (a,b) => { const out=[]; let d=a, i=0; while(d<=b && i<92){out.push(d); d=addDays(d,1); i++;} return out; };
const nowISO = () => new Date(Date.now()+5.5*3600e3).toISOString().slice(0,19)+'+05:30';
const fmtDT = iso => iso ? new Date(iso).toLocaleString(S.lang==='ta'?'ta-IN':'en-IN',{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}) : '';
const fmtD = iso => new Date(iso+'T00:00:00+05:30').toLocaleDateString(S.lang==='ta'?'ta-IN':'en-IN',{timeZone:TZ,weekday:'short',day:'2-digit',month:'short'});

/* data */
const secByCode = c => SECS.find(s=>s.c===c) || {c,en:'?',ta:'?'};
const secOf = id => TASKS.find(t=>t.id===id).s;
const tasksIn = c => TASKS.filter(t=>t.s===c);
const rk = (id,date=S.cdate,st=S.store) => `${date}|${st}|${id}`;
const sk = (c,date=S.cdate,st=S.store) => `${date}|${st}|${c}`;
const getR = id => S.resp[rk(id)];
const complete = r => !!(r && r.a && (r.a==='Y' || (r.r||'').trim().length>0));
const isSub = c => !!S.sub[sk(c)];
const reqDone = c => tasksIn(c).filter(t=>t.m).every(t=>complete(getR(t.id)));
const persist = () => { store.set('svv_resp',S.resp); store.set('svv_sub',S.sub); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2400); }
function setSync(st){ const d=$('#syncDot'); if(d){ d.className='dot '+st; d.title=st==='ok'?T('synced'):st==='syncing'?T('syncing'):st==='err'?T('syncErr'):(API_URL()?'':T('local')); } }

/* ---------------- API layer: App -> Cloudflare Worker -> Google Sheet (+ GitHub backup) ---------------- */
function rowFor(date,st,t){
  const r=S.resp[rk(t.id,date,st)]; if(!r) return null;
  const sec=secByCode(t.s), sb=S.sub[sk(t.s,date,st)];
  return {Date:date,Store:st,SectionCode:t.s,Section:sec.en,TaskID:t.id,Task:t.en,Answer:r.a==='Y'?'Yes':'No',Remarks:r.r||'',
          Status:sb?'Submitted':'Draft',FilledBy:r.by||'',FilledAt:r.at||'',SubmittedAt:sb?sb.at:''};
}
async function api(kind,payload){
  const u=API_URL(); if(!u) return null;
  setSync('syncing');
  try{
    const res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kind,token:S.user&&S.user.token,...payload})});
    const j=await res.json();
    if(j.err==='auth'&&kind!=='login'){ setSync('err'); toast(T('sessionEnd')); logout(); return j; }
    setSync(j.ok===false?'err':'ok'); return j;
  }catch(e){ setSync('err'); return null; }
}
/* offline-safe sync: every edit is marked dirty and re-sent until the server confirms */
let DIRTY=store.get('svv_dirty',{}), PENDSUB=store.get('svv_pendsub',[]), flushT=null, flushing=false;
function markDirty(id){ DIRTY[rk(id)]=(DIRTY[rk(id)]||0)+1; store.set('svv_dirty',DIRTY); scheduleFlush(); }
function scheduleFlush(ms=2000){ if(!API_URL()||!S.user) return; clearTimeout(flushT); flushT=setTimeout(flush,ms); }
async function flush(){
  if(!API_URL()||!S.user||flushing) return; flushing=true; let ok=true;
  try{
    for(const p of [...PENDSUB]){ const j=await api('submit',p); if(j&&j.ok){ PENDSUB=PENDSUB.filter(x=>x!==p); store.set('svv_pendsub',PENDSUB); } else { ok=false; return; } }
    const snap={...DIRTY}, keys=Object.keys(snap); if(!keys.length) return;
    const rows=keys.map(k=>{const [d,s,id]=k.split('|'); const t=TASKS.find(t=>t.id==id); return t?rowFor(d,s,t):null;}).filter(Boolean);
    if(rows.length){ const j=await api('draft',{rows}); if(!(j&&j.ok)){ ok=false; return; } }
    keys.forEach(k=>{ if(DIRTY[k]===snap[k]) delete DIRTY[k]; }); store.set('svv_dirty',DIRTY);
  } finally { flushing=false; if(!ok&&S.user) scheduleFlush(15000); }
}
window.addEventListener('online',()=>flush());
window.addEventListener('resize',()=>{ applyMode(); fitPreview(); });
async function pull(from,to,st){
  if(!API_URL()||!S.user) return;
  try{
    const q=new URLSearchParams({action:'responses',from,to,store:st,token:S.user.token||''});
    const j=await (await fetch(API_URL()+'?'+q)).json();
    if(j.err==='auth'){ toast(T('sessionEnd')); return logout(); }
    (j.rows||[]).forEach(r=>{
      const k=`${r.Date}|${r.Store}|${r.TaskID}`, loc=S.resp[k];
      if(DIRTY[k]&&loc) return;                       // keep local unsynced edits
      S.resp[k]={a:r.Answer==='Yes'?'Y':'N',r:r.Remarks,by:r.FilledBy,at:r.FilledAt};
      if(r.Status==='Submitted') S.sub[`${r.Date}|${r.Store}|${r.SectionCode}`]={by:r.FilledBy,at:r.SubmittedAt};
    });
    persist();
  }catch(e){ setSync('err'); }
}
async function loadRemote(){
  if(!API_URL()) return;
  try{
    const j=await (await fetch(API_URL()+'?action=config')).json();
    if(!j||!j.ok) return;
    if(j.config) cfg={...cfg,...j.config,apiUrl:cfg.apiUrl};
    if(j.stores&&j.stores.length) cfg.stores=j.stores;
    if(j.master&&j.master.tasks&&j.master.tasks.length) applyMaster(j.master);
    store.set('svv_cfg',cfg); applyTheme(); render();
  }catch(e){}
}

/* ---------------- login ---------------- */
async function doLogin(){
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value.trim();
  S.lu=u;
  if(!API_URL()&&!DEMO_OK){ S.loginErr=T('noApi'); render(); return; }
  let user=null;
  if(API_URL()){
    const j=await api('login',{u,p});
    if(j&&j.ok&&j.user) user={...j.user,token:j.token};
    else if(!j){ S.loginErr=T('noServer'); render(); return; }
    else if(j.err&&j.err!=='bad login'){ S.loginErr=T('serverErr')+': '+j.err; render(); return; }
  } else user=DEMO_USERS.find(x=>x.u===u&&x.p===p)||null;
  if(!user){ S.loginErr=T('bad'); render(); return; }
  S.user={u:user.u,name:user.name,role:user.role,store:user.store,token:user.token||''}; store.set('svv_user',S.user);
  S.store=user.store==='ALL'?(store.get('svv_store',null)||cfg.stores[0].id):user.store;

function answer(id,v){
  const c=secOf(id); if(isSub(c)) return;
  const k=rk(id), cur=S.resp[k]||{};
  S.resp[k]={a:v,r:cur.r||'',by:S.user.u,at:nowISO()};
  if(S.tab==='completed'&&!complete(S.resp[k])) S.keep[id]=1;
  persist(); markDirty(id); updateHead();
  if(v==='N'){ render(); const ta=document.querySelector(`[data-rem="${id}"]`); if(ta) ta.focus(); }
  else{
    const card=document.querySelector(`[data-card="${id}"]`);
    if(card) card.querySelectorAll('.yn button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    if(S.tab==='pending'&&!S.keep[id]) toast(T('moved'));
    setTimeout(render,320);
  }
}
async function submitSection(c){
  if(!reqDone(c)){ toast(T('needRem')); return; }
  if(!confirm(T('confirmSub'))) return;
  const ts=tasksIn(c), at=nowISO(), yes=ts.filter(t=>(getR(t.id)||{}).a==='Y').length;
  S.sub[sk(c)]={by:S.user.u,at,yes,total:ts.length};
  S.keep={}; persist(); render();
  const payload={section:{Date:S.cdate,Store:S.store,SectionCode:c,Section:secByCode(c).en,Yes:yes,Total:ts.length,SubmittedBy:S.user.u,SubmittedAt:at},
                 rows:ts.map(t=>rowFor(S.cdate,S.store,t)).filter(Boolean)};
  if(!API_URL()) return;
  const j=await api('submit',payload);
  if(!(j&&j.ok)){ PENDSUB.push(payload); store.set('svv_pendsub',PENDSUB); }
}

/* ---------------- aggregation ---------------- */
function agg(from,to,st){
  const dates=daysBetween(from,to), secs=SECS.map(s=>({...s,total:0,yes:0,no:0,pend:0})), idx={}; secs.forEach(s=>idx[s.c]=s);
  const fails=[];
  dates.forEach(d=>TASKS.forEach(t=>{
    const sec=idx[t.s]; if(!sec) return;
    const r=S.resp[rk(t.id,d,st)]; sec.total++;
    if(!r||!r.a) sec.pend++; else if(r.a==='Y') sec.yes++; else { sec.no++; fails.push({d,t,r}); }
  }));
  const tot=secs.reduce((a,s)=>({total:a.total+s.total,yes:a.yes+s.yes,no:a.no+s.no,pend:a.pend+s.pend}),{total:0,yes:0,no:0,pend:0});
  fails.sort((a,b)=>b.d.localeCompare(a.d)||a.t.s-b.t.s||a.t.id-b.t.id);
  return {secs,tot,fails,dates};
}

function readLogo(file,key){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const mx=260, sc=Math.min(1,mx/Math.max(img.width,img.height)), w=Math.round(img.width*sc), h=Math.round(img.height*sc);
    const mk=bg=>{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); if(bg){g.fillStyle='#fff';g.fillRect(0,0,w,h);} g.drawImage(img,0,0,w,h); return cv; };
    let url=mk(false).toDataURL('image/png'); if(url.length>45000) url=mk(true).toDataURL('image/jpeg',.85);
    if(url.length>45000){ toast(T('logoBig')); return; }
    S.setDraft[key]=url; render();
  }; img.src=fr.result; };
  fr.readAsDataURL(file);
}

      log+=`<tr><td>${t.id}</td><td>${esc(L(t))}</td><td class="${r?(r.a==='Y'?'ok':'no'):'pe'}">${r?(r.a==='Y'?T('yes'):T('no')):'-'}</td><td>${esc(r&&r.r||'')}</td><td style="white-space:nowrap">${r?fmtDT(r.at):''}</td></tr>`;}); });
  return `<div class="rp">
    <table class="rp-head"><tr><td class="hl">${cfg.showLogo2?`<span><img src="${secLogo()}" alt="" onerror="this.onerror=null;this.src=(window.parent||window).__LOGO_2"></span>`:''}</td>
      <td class="hm"><h1>${esc(cfg.company)}</h1><div class="ti">${T('rpTitle')}</div><div class="fcode">${esc(cfg.formCode)}</div></td>
      <td class="hr"><img src="${mainLogo()}" alt="" onerror="this.onerror=null;this.src=(window.parent||window).__LOGO_MAIN"></td></tr></table>
    <table class="rp-meta"><tr><td><small>${T('date')}</small><b>${fmtD(date)} ${date.slice(0,4)}</b></td><td><small>${T('store')}</small><b>${esc(st)}${stName?' · '+esc(stName):''}</b></td>
      <td><small>${T('rpBy')}</small><b>${esc(S.user.name)}</b></td><td><small>${T('time')}</small><b>${fmtDT(firstAt)||'-'}${lastSub?'<br>→ '+fmtDT(lastSub):''}</b></td></tr></table>
    <div class="rp-pad">
      <table class="rp-ov"><tr><td class="big"><div class="pct">${pct}%</div><div class="sc">${tot.yes} / ${tot.total}</div><div class="lb">${T('rpOverall')}</div></td>
        <td class="rt">${bar(tot.yes,tot.no,tot.total,16)}<table class="rp-tiles"><tr>
          <td><b style="color:#1e8a3c">${tot.yes}</b><small>${T('done')}</small></td><td><b style="color:#c0392b">${tot.no}</b><small>${T('failed')}</small></td><td><b style="color:#d97706">${tot.pend}</b><small>${T('pending')}</small></td></tr></table></td></tr></table>
      <h3>${T('rpSec')}</h3><table class="rp-sc">${secRows}</table>
      <h3>${T('rpFail')} (${fails.length})</h3>${failBox}
    </div>
    <div class="rp-pad pb"><h3>${T('rpLog')}</h3>
      <table class="rp-log"><thead><tr><th style="width:26px">#</th><th>${T('pt')}</th><th style="width:48px">${T('ans')}</th><th style="width:160px">${T('rem')}</th><th style="width:84px">${T('time')}</th></tr></thead><tbody>${log}</tbody></table>
      <table class="rp-sign keep"><tr><td><div>${T('rpMgr')}</div></td><td><div>${T('rpAud')}</div></td></tr></table>
      <div class="rp-foot">${T('rpGen')}: ${fmtDT(nowISO())} (IST)${cfg.pdfFooter?' · '+esc(cfg.pdfFooter):''}</div>
    </div></div>`;
}
function openPreview(date){
  closePreview(); S.pv={date,store:S.store};
  const el=document.createElement('div'); el.id='pv';
  el.innerHTML=`<div class="pv-bar"><b>${T('pvTitle')}</b>
    <button class="btn gold" data-act="pvSave">⬇ ${T('pvSave')}</button><button class="btn out" data-act="pvPrint">🖨 ${T('pvPrint')}</button><button class="btn out" data-act="pvClose">✕ ${T('pvClose')}</button></div>
    <div class="pv-body"><div class="pv-wrap" id="pvWrap"><div class="pv-inner" id="pvInner">${reportHTML(date,S.store)}</div></div></div>`;
  document.body.appendChild(el); document.body.classList.add('pvopen'); fitPreview();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitPreview);
  setTimeout(fitPreview,300);
}
function fitPreview(){
  const body=document.querySelector('.pv-body'), inner=$('#pvInner'), wrap=$('#pvWrap'); if(!body||!inner||!wrap) return;
  const k=Math.min(1,(body.clientWidth-16)/794);
  inner.style.transform=`scale(${k})`; wrap.style.width=(794*k)+'px'; wrap.style.height=(inner.offsetHeight*k)+'px';
}
function closePreview(){ const e=$('#pv'); if(e) e.remove(); document.body.classList.remove('pvopen'); S.pv=null; }
async function savePDF(){
  if(!S.pv) return;
  if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF)){ toast(T('pdfLoadFail')); return; }
  const btn=document.querySelector('[data-act=pvSave]'); if(btn) btn.disabled=true; toast(T('pdfMaking'));
  let frame=null;
  try{
    /* the report is drawn in its own hidden page that is exactly 794 px wide, so the screen size can never shift or cut it */
    frame=document.createElement('iframe'); frame.setAttribute('aria-hidden','true');
    frame.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0';
    document.body.appendChild(frame);
    const doc=frame.contentDocument; doc.open(); doc.write('<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#fff"></body></html>'); doc.close();
    doc.documentElement.style.cssText=document.documentElement.style.cssText;
    document.querySelectorAll('style,link[rel=stylesheet]').forEach(n=>doc.head.appendChild(n.cloneNode(true)));
    doc.body.innerHTML=reportHTML(S.pv.date,S.pv.store);
    /* wait until every logo has really loaded */
    await Promise.all([...doc.images].map(im=>new Promise(res=>{
      if(im.complete&&im.naturalWidth) return res();
      const t=setTimeout(res,5000); const ok=()=>{clearTimeout(t);res();};
      im.addEventListener('load',ok); im.addEventListener('error',()=>setTimeout(ok,300));
    })));
    try{ await Promise.race([doc.fonts.ready,new Promise(r=>setTimeout(r,3000))]); }catch(e){}
    await new Promise(r=>setTimeout(r,200));
    const root=doc.querySelector('.rp'), W=794, H=root.scrollHeight;
    frame.style.height=(H+40)+'px';
    /* page breaks: only between rows / boxes, never through one */
    const rr=root.getBoundingClientRect(), offTop=el=>el.getBoundingClientRect().top-rr.top;
    const safe=[...root.querySelectorAll('.rp-head,.rp-meta,.rp-ov,.rp-sc tr,.rp-log tbody tr:not(.sh),.rp-fail,.rp-okmsg,.rp-sign')].map(el=>el.getBoundingClientRect().bottom-rr.top).sort((x,y)=>x-y);
    const forced=[...root.querySelectorAll('.pb')].map(offTop);
    const mm=W/210, cap=i=>(297-(i?8:0)-13)*mm, pages=[]; let pos=0;
    while(pos<H-1&&pages.length<60){
      const limit=pos+cap(pages.length); let cut;
      const f=forced.find(y=>y>pos+4&&y<=limit+0.5);
      if(f!==undefined) cut=f;
      else if(H<=limit+0.5) cut=H;
      else { const c=safe.filter(y=>y>pos+40&&y<=limit); cut=c.length?c[c.length-1]:limit; }
      pages.push([pos,cut]); pos=cut;
    }
    const sc=Math.min(2,Math.sqrt(14e6/(W*H)));
    const canvas=await html2canvas(root,{scale:sc,useCORS:true,backgroundColor:'#ffffff',logging:false,windowWidth:W,windowHeight:H});
    const k=canvas.width/W, pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const footer=String(cfg.formCode||'').replace(/[^\x20-\x7E]/g,'');
    pages.forEach((pg,i)=>{
      const sy=Math.round(pg[0]*k), sh=Math.max(1,Math.round((pg[1]-pg[0])*k));
      const c=document.createElement('canvas'); c.width=canvas.width; c.height=sh;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,sh); g.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,i?8:0,210,(pg[1]-pg[0])/mm);
      pdf.setFontSize(8); pdf.setTextColor(120);
      if(footer) pdf.text(footer,10,291); pdf.text(`Page ${i+1} of ${pages.length}`,200,291,{align:'right'});
      c.width=0;
    });
    canvas.width=0;
    pdf.save(`Checklist_Summary_${S.pv.store}_${S.pv.date}.pdf`);
    toast(T('pdfSaved'));
  }catch(e){ toast(T('pdfLoadFail')); }
  if(frame) frame.remove(); if(btn) btn.disabled=false;
}
function printPDF(){
  if(!S.pv) return; const area=$('#printArea'); area.innerHTML=reportHTML(S.pv.date,S.pv.store);
  document.body.classList.add('printing'); window.print();
}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');$('#printArea').innerHTML='';});

/* ---------------- events ---------------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
  if(a==='login') return doLogin();
  if(a==='lang'){ S.lang=el.dataset.v; store.set('svv_lang',S.lang); return render(); }
  if(a==='logout') return logout();
  if(a==='nav'){ S.view=el.dataset.v; S.keep={}; if(S.view==='settings') S.setDraft=JSON.parse(JSON.stringify(cfg)); if(S.view==='dash') await pull(S.from,S.to,S.store); return render(); }
  if(a==='chip'){ S.from=el.dataset.a; S.to=el.dataset.b; await pull(S.from,S.to,S.store); return render(); }
  if(a==='go'){ let f=$('#fFrom').value||S.from, t=$('#fTo').value||S.to; if(f>t)[f,t]=[t,f]; S.from=f; S.to=t; await pull(f,t,S.store); return render(); }
  if(a==='tab'){ S.tab=el.dataset.v; S.keep={}; return render(); }
  if(a==='toggle'){ const c=el.dataset.c; S.collapsed[c]=!S.collapsed[c]; return render(); }
  if(a==='ans') return answer(+el.dataset.id,el.dataset.v);
  if(a==='addrem'){ S.openRem[el.dataset.id]=true; render(); const ta=document.querySelector(`[data-rem="${el.dataset.id}"]`); if(ta) ta.focus(); return; }
  if(a==='submit') return submitSection(+el.dataset.c);
  if(a==='pdf') return openPreview(el.dataset.d);
  if(a==='pvSave') return savePDF();
  if(a==='pvPrint') return printPDF();
  if(a==='pvClose') return closePreview();
  if(a==='view'){ store.set(VIEW_KEY,el.dataset.v); applyMode(); render(); fitPreview(); return; }
  if(a==='logoReset'){ S.setDraft[el.dataset.k]=''; return render(); }
  if(a==='preset'){ S.setDraft.color=el.dataset.c; return render(); }
  if(a==='addStore'){ S.setDraft.stores.push({id:'SVV-0'+(S.setDraft.stores.length+1),name:''}); return render(); }
  if(a==='delStore'){ S.setDraft.stores.splice(+el.dataset.i,1); return render(); }
  if(a==='saveCfg') return saveCfg();
  if(a==='testConn') return testConn();
  if(a==='expCfg'){ const b=new Blob([JSON.stringify(S.setDraft,null,2)],{type:'application/json'}), u=URL.createObjectURL(b), l=document.createElement('a'); l.href=u; l.download='svv-settings.json'; l.click(); return URL.revokeObjectURL(u); }
  if(a==='resetCfg'){ if(confirm(T('confirmReset'))){ S.setDraft=JSON.parse(JSON.stringify({...DEFAULTS,apiUrl:cfg.apiUrl})); render(); } return; }
});
document.addEventListener('input',e=>{
  const t=e.target, ds=t.dataset||{};
  if(ds.rem){ const k=rk(+ds.rem), cur=S.resp[k]||{}; S.resp[k]={...cur,r:t.value,by:S.user.u,at:nowISO()};
    t.classList.toggle('req',cur.a==='N'&&!t.value.trim()); persist(); markDirty(+ds.rem); updateHead(); return; }
  if(S.setDraft){
    if(ds.cf) S.setDraft[ds.cf]=t.type==='checkbox'?t.checked:t.value;
    if(ds.st!==undefined) S.setDraft.stores[+ds.st][ds.sf]=t.value;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target, ds=t.dataset||{};
  if(t.id==='storeSel'){ S.store=t.value; store.set('svv_store',S.store); await pull(S.from,S.to,S.store); render(); }
  if(t.id==='cDate'){ S.cdate=t.value||todayISO(); S.keep={}; await pull(S.cdate,S.cdate,S.store); render(); }
  if(ds.logo&&t.files[0]) readLogo(t.files[0],ds.logo);
  if(ds.cf==='color'&&S.setDraft){ S.setDraft.color=t.value; render(); }
  if(t.id==='impCfg'&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const j=JSON.parse(fr.result); S.setDraft={...S.setDraft,...j,apiUrl:S.setDraft.apiUrl}; render(); }catch(x){ toast('Invalid file'); } }; fr.readAsText(t.files[0]); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.pv) closePreview(); if(e.key==='Enter'&&!S.user&&(e.target.id==='lu'||e.target.id==='lp')) doLogin(); });

/* ---------------- boot ---------------- */
(function init(){
  applyMode(); applyTheme();
  if(S.user){ S.store=S.user.store!=='ALL'?S.user.store:(S.store&&cfg.stores.some(s=>s.id===S.store)?S.store:cfg.stores[0].id); }
  S.cdate=todayISO(); S.from=S.to=todayISO();
  render(); checkConn(); loadRemote(); flush();
})();
</script>
